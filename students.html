<!DOCTYPE html>
<html>
<head>

    <title>Student Management - Computer Laboratory</title>

</head>

<body>

    <h1>Student Management</h1>

    <p>
        Manage students registered in the Computer Laboratory Access System.
    </p>

    <button
        type="button"
        id="logoutButton"
    >
        Logout
    </button>

    <hr>

    <h2>Add Student</h2>

    <label for="studentID">
        Student ID:
    </label>

    <br>

    <input
        type="text"
        id="studentID"
        placeholder="Enter Student ID"
    >

    <br><br>

    <label for="fullName">
        Full Name:
    </label>

    <br>

    <input
        type="text"
        id="fullName"
        placeholder="Enter Full Name"
    >

    <br><br>

    <button
        type="button"
        id="saveButton"
    >
        Add Student
    </button>

    <button
        type="button"
        id="cancelButton"
        style="display: none;"
    >
        Cancel Edit
    </button>

    <p id="message"></p>

    <hr>

    <h2>Registered Students</h2>

    <table border="1" cellpadding="8">

        <thead>

            <tr>
                <th>Student ID</th>
                <th>Full Name</th>
                <th>Actions</th>
            </tr>

        </thead>

        <tbody id="studentsTableBody">
        </tbody>

    </table>

    <p id="studentCount"></p>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            getDoc,
            setDoc,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        const firebaseConfig = {

            apiKey: "AIzaSyC8vy5n9RcdZXCgxK7HZAWGo9NzTtqOga8",

            authDomain:
                "comlab-access-system.firebaseapp.com",

            projectId:
                "comlab-access-system",

            storageBucket:
                "comlab-access-system.firebasestorage.app",

            messagingSenderId:
                "136458270853",

            appId:
                "1:136458270853:web:0ee5c5d822b109c9d151ec",

            measurementId:
                "G-6PMJ2STTDD"

        };


        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        const db =
            getFirestore(app);


        const studentIDInput =
            document.getElementById(
                "studentID"
            );


        const fullNameInput =
            document.getElementById(
                "fullName"
            );


        const saveButton =
            document.getElementById(
                "saveButton"
            );


        const cancelButton =
            document.getElementById(
                "cancelButton"
            );


        const logoutButton =
            document.getElementById(
                "logoutButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        const tableBody =
            document.getElementById(
                "studentsTableBody"
            );


        const studentCount =
            document.getElementById(
                "studentCount"
            );


        let editingStudentID = null;


        // CHECK LOGIN STATUS
        onAuthStateChanged(
            auth,
            function(user) {

                if (!user) {

                    window.location.href =
                        "login.html";

                    return;

                }


                loadStudents();

            }
        );


        // LOAD STUDENTS
        async function loadStudents() {

            message.textContent =
                "Loading students...";


            try {

                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "students"
                        )
                    );


                tableBody.innerHTML = "";


                let count = 0;


                snapshot.forEach(
                    function(studentDoc) {

                        const data =
                            studentDoc.data();


                        const studentID =
                            String(
                                data.studentId || ""
                            );


                        const fullName =
                            String(
                                data.fullName || ""
                            );


                        const row =
                            document.createElement(
                                "tr"
                            );


                        const idCell =
                            document.createElement(
                                "td"
                            );

                        idCell.textContent =
                            studentID;


                        const nameCell =
                            document.createElement(
                                "td"
                            );

                        nameCell.textContent =
                            fullName;


                        const actionCell =
                            document.createElement(
                                "td"
                            );


                        const editButton =
                            document.createElement(
                                "button"
                            );


                        editButton.textContent =
                            "Edit";


                        editButton.type =
                            "button";


                        editButton.onclick =
                            function() {

                                editStudent(
                                    studentID
                                );

                            };


                        const deleteButton =
                            document.createElement(
                                "button"
                            );


                        deleteButton.textContent =
                            "Delete";


                        deleteButton.type =
                            "button";


                        deleteButton.onclick =
                            function() {

                                deleteStudent(
                                    studentID,
                                    fullName
                                );

                            };


                        actionCell.appendChild(
                            editButton
                        );


                        actionCell.appendChild(
                            document.createTextNode(
                                " "
                            )
                        );


                        actionCell.appendChild(
                            deleteButton
                        );


                        row.appendChild(
                            idCell
                        );


                        row.appendChild(
                            nameCell
                        );


                        row.appendChild(
                            actionCell
                        );


                        tableBody.appendChild(
                            row
                        );


                        count++;

                    }
                );


                studentCount.textContent =
                    "Total students: " +
                    count;


                message.textContent =
                    "Students loaded successfully.";

            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to load students.";

            }

        }


        // ADD / UPDATE STUDENT
        saveButton.onclick =
            async function() {

                const studentID =
                    studentIDInput.value.trim();


                const fullName =
                    fullNameInput.value.trim();


                if (
                    studentID === "" ||
                    fullName === ""
                ) {

                    message.textContent =
                        "Please enter both Student ID and Full Name.";

                    return;

                }


                saveButton.disabled =
                    true;


                try {

                    // UPDATE EXISTING STUDENT
                    if (
                        editingStudentID !== null
                    ) {

                        const studentRef =
                            doc(
                                db,
                                "students",
                                editingStudentID
                            );


                        await setDoc(
                            studentRef,
                            {

                                studentId:
                                    studentID,

                                fullName:
                                    fullName

                            }
                        );


                        message.textContent =
                            "Student updated successfully.";


                    }

                    // ADD NEW STUDENT
                    else {

                        const studentRef =
                            doc(
                                db,
                                "students",
                                studentID
                            );


                        const existingStudent =
                            await getDoc(
                                studentRef
                            );


                        if (
                            existingStudent.exists()
                        ) {

                            message.textContent =
                                "That Student ID already exists.";

                            saveButton.disabled =
                                false;

                            return;

                        }


                        await setDoc(
                            studentRef,
                            {

                                studentId:
                                    studentID,

                                fullName:
                                    fullName

                            }
                        );


                        message.textContent =
                            "Student added successfully.";

                    }


                    clearForm();

                    await loadStudents();


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to save student.";

                }


                saveButton.disabled =
                    false;

            };


        // EDIT STUDENT
        async function editStudent(studentID) {

            try {

                const studentRef =
                    doc(
                        db,
                        "students",
                        studentID
                    );


                const studentSnapshot =
                    await getDoc(
                        studentRef
                    );


                if (
                    !studentSnapshot.exists()
                ) {

                    message.textContent =
                        "Student not found.";

                    return;

                }


                const data =
                    studentSnapshot.data();


                studentIDInput.value =
                    data.studentId || "";


                fullNameInput.value =
                    data.fullName || "";


                editingStudentID =
                    studentID;


                saveButton.textContent =
                    "Update Student";


                cancelButton.style.display =
                    "inline-block";


                message.textContent =
                    "Editing student " +
                    studentID +
                    ".";


                window.scrollTo(
                    0,
                    0
                );


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to load student information.";

            }

        }


        // DELETE STUDENT
        async function deleteStudent(
            studentID,
            fullName
        ) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete " +
                    fullName +
                    " (" +
                    studentID +
                    ")?"
                );


            if (!confirmed) {

                return;

            }


            try {

                const studentRef =
                    doc(
                        db,
                        "students",
                        studentID
                    );


                await deleteDoc(
                    studentRef
                );


                message.textContent =
                    "Student deleted successfully.";


                await loadStudents();


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to delete student.";

            }

        }


        // CANCEL EDIT
        cancelButton.onclick =
            function() {

                clearForm();

                message.textContent =
                    "Edit cancelled.";

            };


        // CLEAR FORM
        function clearForm() {

            studentIDInput.value =
                "";

            fullNameInput.value =
                "";

            editingStudentID =
                null;


            saveButton.textContent =
                "Add Student";


            cancelButton.style.display =
                "none";

        }


        // LOGOUT
        logoutButton.onclick =
            async function() {

                try {

                    await signOut(
                        auth
                    );


                    window.location.href =
                        "login.html";


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to log out.";

                }

            };

    </script>

</body>
</html>
