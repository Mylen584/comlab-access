<!DOCTYPE html>
<html>
<head>

    <title>Access Records - Computer Laboratory</title>

</head>

<body>

    <h1>Computer Laboratory Access Records</h1>

    <p>
        Records stored in the Firebase Firestore database.
    </p>

    <hr>

    <h2>Search and Filter</h2>

    <label for="searchInput">
        Search Student ID or Full Name:
    </label>

    <br>

    <input
        type="text"
        id="searchInput"
        placeholder="Enter Student ID or name"
    >

    <button type="button" id="searchButton">
        Search
    </button>

    <br><br>

    <label for="dateFilter">
        Filter by Date:
    </label>

    <br>

    <input
        type="date"
        id="dateFilter"
    >

    <br><br>

    <button type="button" id="clearButton">
        Clear Filters
    </button>

    <hr>

    <h2>Access Records</h2>

    <table border="1" cellpadding="8">

        <thead>

            <tr>
                <th>Student ID</th>
                <th>Full Name</th>
                <th>Date</th>
                <th>Time In</th>
                <th>Time Out</th>
            </tr>

        </thead>

        <tbody id="recordsTableBody">
        </tbody>

    </table>

    <p id="recordCount"></p>

    <p id="message"></p>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        const firebaseConfig = {

            apiKey: "AIzaSyC8vy5nR9cdZXCgxK7HZAWGo9NzTtqOga8",

            authDomain:
                "comlab-access-system.firebaseapp.com",

            projectId:
                "comlab-access-system",

            storageBucket:
                "comlab-access-system.firebasestorage.app",

            messagingSenderId:
                "136458270853",

            appId:
                "1:136458270853:web:0ee5c5d822b109c9d151ec",

            measurementId:
                "G-6PMJ2STTDD"

        };


        const app =
            initializeApp(firebaseConfig);


        const db =
            getFirestore(app);


        const tableBody =
            document.getElementById(
                "recordsTableBody"
            );


        const message =
            document.getElementById(
                "message"
            );


        const recordCount =
            document.getElementById(
                "recordCount"
            );


        const searchInput =
            document.getElementById(
                "searchInput"
            );


        const searchButton =
            document.getElementById(
                "searchButton"
            );


        const dateFilter =
            document.getElementById(
                "dateFilter"
            );


        const clearButton =
            document.getElementById(
                "clearButton"
            );


        let allRecords = [];


        // LOAD RECORDS
        async function loadRecords() {

            message.textContent =
                "Loading records...";


            try {

                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "accessRecords"
                        )
                    );


                allRecords = [];


                snapshot.forEach(
                    function(record) {

                        const data =
                            record.data();


                        allRecords.push({

                            studentId:
                                String(
                                    data.studentId || ""
                                ),

                            fullName:
                                String(
                                    data.fullName || ""
                                ),

                            date:
                                String(
                                    data.date || ""
                                ),

                            timeIn:
                                String(
                                    data.timeIn || ""
                                ),

                            timeOut:
                                String(
                                    data.timeOut || ""
                                )

                        });

                    }
                );


                displayRecords(
                    "",
                    ""
                );


                message.textContent =
                    "Access records loaded successfully.";


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to load access records.";

            }

        }


        // DISPLAY RECORDS
        function displayRecords(
            searchText,
            selectedDate
        ) {

            tableBody.innerHTML = "";


            searchText =
                searchText
                    .trim()
                    .toLowerCase();


            const filteredRecords =
                allRecords.filter(
                    function(record) {

                        const studentID =
                            record.studentId
                                .trim()
                                .toLowerCase();


                        const fullName =
                            record.fullName
                                .trim()
                                .toLowerCase();


                        const recordDate =
                            record.date
                                .trim();


                        const matchesSearch =
                            searchText === "" ||

                            studentID.includes(
                                searchText
                            ) ||

                            fullName.includes(
                                searchText
                            );


                        const matchesDate =
                            selectedDate === "" ||

                            recordDate ===
                            selectedDate;


                        return (
                            matchesSearch &&
                            matchesDate
                        );

                    }
                );


            filteredRecords.forEach(
                function(record) {

                    const row =
                        document.createElement(
                            "tr"
                        );


                    const studentID =
                        document.createElement(
                            "td"
                        );

                    studentID.textContent =
                        record.studentId;


                    const fullName =
                        document.createElement(
                            "td"
                        );

                    fullName.textContent =
                        record.fullName;


                    const date =
                        document.createElement(
                            "td"
                        );

                    date.textContent =
                        record.date;


                    const timeIn =
                        document.createElement(
                            "td"
                        );

                    timeIn.textContent =
                        record.timeIn;


                    const timeOut =
                        document.createElement(
                            "td"
                        );

                    timeOut.textContent =
                        record.timeOut;


                    row.appendChild(
                        studentID
                    );

                    row.appendChild(
                        fullName
                    );

                    row.appendChild(
                        date
                    );

                    row.appendChild(
                        timeIn
                    );

                    row.appendChild(
                        timeOut
                    );


                    tableBody.appendChild(
                        row
                    );

                }
            );


            recordCount.textContent =
                "Showing " +
                filteredRecords.length +
                " of " +
                allRecords.length +
                " record(s).";


            if (
                filteredRecords.length === 0
            ) {

                message.textContent =
                    "No matching records found.";

            } else {

                message.textContent =
                    "";

            }

        }


        // SEARCH BUTTON
        searchButton.onclick =
            function() {

                displayRecords(

                    searchInput.value,

                    dateFilter.value

                );

            };


        // DATE FILTER
        dateFilter.onchange =
            function() {

                displayRecords(

                    searchInput.value,

                    dateFilter.value

                );

            };


        // CLEAR BUTTON
        clearButton.onclick =
            function() {

                searchInput.value = "";

                dateFilter.value = "";

                displayRecords(
                    "",
                    ""
                );

            };


        // LOAD DATA
        loadRecords();

    </script>

</body>
</html>
