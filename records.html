<!DOCTYPE html>
<html>
<head>

    <title>Access Records - Computer Laboratory</title>

</head>

<body>

    <h1>Computer Laboratory Access Records</h1>

    <p>
        Records stored in the Firebase Firestore database.
    </p>

    <hr>

    <h2>Search and Filter</h2>

    <label for="searchInput">
        Search Student ID or Full Name:
    </label>

    <br>

    <input
        type="text"
        id="searchInput"
        placeholder="Enter Student ID or name"
    >

    <br><br>

    <label for="dateFilter">
        Filter by Date:
    </label>

    <br>

    <input
        type="date"
        id="dateFilter"
    >

    <br><br>

    <button type="button" onclick="clearFilters()">
        Clear Filters
    </button>

    <hr>

    <h2>Access Records</h2>

    <table border="1" cellpadding="8">

        <thead>

            <tr>
                <th>Student ID</th>
                <th>Full Name</th>
                <th>Date</th>
                <th>Time In</th>
                <th>Time Out</th>
            </tr>

        </thead>

        <tbody id="recordsTableBody">

        </tbody>

    </table>

    <p id="recordCount"></p>

    <p id="message"></p>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        const firebaseConfig = {

            apiKey: "AIzaSyC8vy5nR9cdZXCgxK7HZAWGo9NzTtqOga8",

            authDomain:
                "comlab-access-system.firebaseapp.com",

            projectId:
                "comlab-access-system",

            storageBucket:
                "comlab-access-system.firebasestorage.app",

            messagingSenderId:
                "136458270853",

            appId:
                "1:136458270853:web:0ee5c5d822b109c9d151ec",

            measurementId:
                "G-6PMJ2STTDD"

        };


        const app =
            initializeApp(firebaseConfig);


        const db =
            getFirestore(app);


        const tableBody =
            document.getElementById(
                "recordsTableBody"
            );


        const message =
            document.getElementById(
                "message"
            );


        const recordCount =
            document.getElementById(
                "recordCount"
            );


        const searchInput =
            document.getElementById(
                "searchInput"
            );


        const dateFilter =
            document.getElementById(
                "dateFilter"
            );


        let allRecords = [];


        // LOAD RECORDS FROM FIRESTORE
        async function loadRecords() {

            tableBody.innerHTML = "";

            message.textContent =
                "Loading records...";


            try {

                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "accessRecords"
                        )
                    );


                allRecords = [];


                snapshot.forEach(
                    (record) => {

                        const data =
                            record.data();


                        allRecords.push({

                            studentId:
                                data.studentId || "",

                            fullName:
                                data.fullName || "",

                            date:
                                data.date || "",

                            timeIn:
                                data.timeIn || "",

                            timeOut:
                                data.timeOut || ""

                        });

                    }
                );


                displayRecords();


                message.textContent =
                    "Access records loaded successfully.";


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to load access records.";

            }

        }


        // DISPLAY RECORDS
        function displayRecords() {

            tableBody.innerHTML = "";


            const searchText =
                searchInput.value
                    .trim()
                    .toLowerCase();


            const selectedDate =
                dateFilter.value;


            const filteredRecords =
                allRecords.filter(
                    (record) => {


                        const matchesSearch =

                            record.studentId
                                .toLowerCase()
                                .includes(searchText)

                            ||

                            record.fullName
                                .toLowerCase()
                                .includes(searchText);


                        const matchesDate =

                            selectedDate === ""

                            ||

                            record.date ===
                            selectedDate;


                        return (
                            matchesSearch &&
                            matchesDate
                        );

                    }
                );


            filteredRecords.forEach(
                (record) => {

                    const row =
                        document.createElement(
                            "tr"
                        );


                    const studentID =
                        document.createElement(
                            "td"
                        );

                    studentID.textContent =
                        record.studentId;


                    const fullName =
                        document.createElement(
                            "td"
                        );

                    fullName.textContent =
                        record.fullName;


                    const date =
                        document.createElement(
                            "td"
                        );

                    date.textContent =
                        record.date;


                    const timeIn =
                        document.createElement(
                            "td"
                        );

                    timeIn.textContent =
                        record.timeIn;


                    const timeOut =
                        document.createElement(
                            "td"
                        );

                    timeOut.textContent =
                        record.timeOut;


                    row.appendChild(
                        studentID
                    );

                    row.appendChild(
                        fullName
                    );

                    row.appendChild(
                        date
                    );

                    row.appendChild(
                        timeIn
                    );

                    row.appendChild(
                        timeOut
                    );


                    tableBody.appendChild(
                        row
                    );

                }
            );


            recordCount.textContent =
                "Showing " +
                filteredRecords.length +
                " record(s).";


            if (
                filteredRecords.length === 0
            ) {

                message.textContent =
                    "No matching records found.";

            }

        }


        // CLEAR FILTERS
        window.clearFilters = function() {

            searchInput.value = "";

            dateFilter.value = "";

            displayRecords();

            message.textContent =
                "Filters cleared.";

        };


        // SEARCH AS USER TYPES
        searchInput.addEventListener(
            "input",
            displayRecords
        );


        // FILTER WHEN DATE CHANGES
        dateFilter.addEventListener(
            "change",
            displayRecords
        );


        // LOAD RECORDS WHEN PAGE OPENS
        loadRecords();

    </script>

</body>
</html>
