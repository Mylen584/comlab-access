<!DOCTYPE html>
<html>
<head>
    <title>Computer Laboratory Access</title>
</head>

<body>

    <h1>Computer Laboratory Access</h1>

    <p>Welcome to the Computer Laboratory Access System!</p>

    <label for="studentID">Student ID:</label>

    <input
        type="text"
        id="studentID"
        placeholder="Enter your Student ID"
    >

    <br><br>

    <button type="button" onclick="recordAccess()">
        Record Access
    </button>

    <p id="message"></p>

    <script>

        const scriptURL =
            "https://script.google.com/macros/s/AKfycbwu2k7fy4IE-dPFmuah0DEEkNaEMV6HiAHPMT-PhJPkfSTbAnx_M8hEiFr98qBCZCsM/exec";

        // Record student access
        function recordAccess() {

            const studentID =
                document.getElementById("studentID").value.trim();

            if (studentID === "") {

                document.getElementById("message").textContent =
                    "Please enter your Student ID.";

                return;
            }

            const now = new Date();

            const date = now.toLocaleDateString();
            const time = now.toLocaleTimeString();

            const data = {
                studentID: studentID,
                date: date,
                time: time
            };

            // Send data to Google Sheets
            fetch(scriptURL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(data)
            });

            // Display confirmation
            document.getElementById("message").textContent =
                "Access recorded successfully.";

            // Clear Student ID field
            document.getElementById("studentID").value = "";

        }

    </script>

</body>
</html>
