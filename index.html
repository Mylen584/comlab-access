<!DOCTYPE html>
<html>
<head>
    <title>Computer Laboratory Access</title>
</head>

<body>

    <h1>Computer Laboratory Access</h1>

    <p>Welcome to the Computer Laboratory Access System!</p>

    <label for="studentID">Student ID:</label>
    <input
        type="text"
        id="studentID"
        placeholder="Enter your Student ID"
    >

    <br><br>

    <button type="button" onclick="recordAccess()">
        Record Access
    </button>

    <p id="message"></p>



   <script>

    // Sample student records
    const students = {
        "2026-0001": "Juan Dela Cruz",
        "2026-0002": "Maria Santos",
        "2026-0003": "Pedro Reyes"
    };

    const scriptURL = "https://script.google.com/macros/s/AKfycbwu2k7fy4IE-dPFmuah0DEEkNaEMV6HiAHPMT-PhJPkfSTbAnx_M8hEiFr98qBCZCsM/exec";

    // Record student access
    function recordAccess() {

        const studentID =
            document.getElementById("studentID").value.trim();

        // Check if Student ID exists
        if (students[studentID]) {

            const name = students[studentID];

            const now = new Date();

            const date = now.toLocaleDateString();

            const time = now.toLocaleTimeString();

            // Data to send to Google Sheets
            const data = {
                studentID: studentID,
                name: name,
                date: date,
                time: time
            };

            // Send data to Google Sheets
            fetch(scriptURL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(data)
            });

            // Display confirmation
            document.getElementById("message").textContent =
                "Access recorded successfully for " + name + ".";

            // Clear Student ID field
            document.getElementById("studentID").value = "";

        } else {

            document.getElementById("message").textContent =
                "Student ID not found. Please enter a valid Student ID.";

        }
    }

</script>

</body>
</html>
