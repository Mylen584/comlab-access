<!DOCTYPE html>
<html>
<head>
    <title>Computer Laboratory Access</title>
</head>

<body>

    <h1>Computer Laboratory Access</h1>

    <p>Welcome to the Computer Laboratory Access System!</p>

    <label for="studentID">Student ID:</label>

    <input
        type="text"
        id="studentID"
        placeholder="Enter your Student ID"
    >

    <br><br>

    <button type="button" onclick="recordAccess()">
        Record Access
    </button>

    <p id="message"></p>

    <script>

        const scriptURL =
            "https://script.google.com/macros/s/AKfycbwu2k7fy4IE-dPFmuah0DEEkNaEMV6HiAHPMT-PhJPkfSTbAnx_M8hEiFr98qBCZCsM/exec";

        // Record student access
        async function recordAccess() {

    const studentID =
        document.getElementById("studentID").value.trim();

    const message =
        document.getElementById("message");

    if (studentID === "") {

        message.textContent =
            "Please enter your Student ID.";

        return;
    }

    message.textContent = "Checking Student ID...";

    try {

        // Look up the student's name
        const response = await fetch(
            scriptURL + "?studentID=" +
            encodeURIComponent(studentID)
        );

        const student = await response.json();

        if (!student.found) {

            message.textContent =
                "Student ID not found. Please enter a valid Student ID.";

            return;
        }

        const now = new Date();

        const date = now.toLocaleDateString();
        const time = now.toLocaleTimeString();

        const data = {
            studentID: studentID,
            date: date,
            time: time
        };

        // Record access in Google Sheets
        await fetch(scriptURL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(data)
        });

        message.textContent =
            "Access recorded successfully for " +
            student.name + ".";

        document.getElementById("studentID").value = "";

    } catch (error) {

        message.textContent =
            "An error occurred. Please try again.";

        console.error(error);

    }

}

    </script>

</body>
</html>
