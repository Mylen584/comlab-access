<!DOCTYPE html>
<html>
<head>
    <title>Computer Laboratory Access</title>
</head>

<body>

    <h1>Computer Laboratory Access</h1>

    <p>Welcome to the Computer Laboratory Access System!</p>

    <label for="studentID">Student ID:</label>

    <input
        type="text"
        id="studentID"
        placeholder="Enter your Student ID"
    >

    <br><br>

    <button type="button" onclick="recordAccess()">
        Record Access
    </button>

    <p id="message"></p>

    <script type="module">

        // Firebase SDK
        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

        import {
            getFirestore,
            doc,
            getDoc,
            collection,
            addDoc,
            query,
            where,
            getDocs,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        // Firebase configuration
        const firebaseConfig = {

            apiKey: "AIzaSyC8vy5n9RcdZXCgxK7HZAWGo9NzTtqOga8",

            authDomain:
                "comlab-access-system.firebaseapp.com",

            projectId:
                "comlab-access-system",

            storageBucket:
                "comlab-access-system.firebasestorage.app",

            messagingSenderId:
                "136458270853",

            appId:
                "1:136458270853:web:0ee5c5d822b109c9d151ec",

            measurementId:
                "G-6PMJ2STTDD"
        };


        // Initialize Firebase
        const app =
            initializeApp(firebaseConfig);


        // Initialize Firestore
        const db =
            getFirestore(app);


        // Message element
        const message =
            document.getElementById("message");


        // Philippine date
        function getPhilippineDate() {

            const now =
                new Date();

            return new Intl.DateTimeFormat(
                "en-CA",
                {
                    timeZone: "Asia/Manila",
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit"
                }
            ).format(now);

        }


        // Philippine time
        function getPhilippineTime() {

            const now =
                new Date();

            return new Intl.DateTimeFormat(
                "en-US",
                {
                    timeZone: "Asia/Manila",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: true
                }
            ).format(now);

        }


        // Record student access
        window.recordAccess = async function() {

            const studentID =
                document
                    .getElementById("studentID")
                    .value
                    .trim();


            if (studentID === "") {

                message.textContent =
                    "Please enter your Student ID.";

                return;

            }


            message.textContent =
                "Checking student information...";


            try {

                // Find student document
                const studentRef =
                    doc(
                        db,
                        "students",
                        studentID
                    );


                const studentSnapshot =
                    await getDoc(studentRef);


                // Student ID does not exist
                if (!studentSnapshot.exists()) {

                    message.textContent =
                        "Student ID not found. Please enter a valid Student ID.";

                    return;

                }


                // Get student information
                const studentData =
                    studentSnapshot.data();


                const fullName =
                    studentData.fullName;


                const today =
                    getPhilippineDate();


                const currentTime =
                    getPhilippineTime();


                message.textContent =
                    "Recording access...";


                // Find today's records for this student
                const accessQuery =
                    query(
                        collection(db, "accessRecords"),
                        where(
                            "studentId",
                            "==",
                            studentID
                        )
                    );


                const accessSnapshot =
                    await getDocs(accessQuery);


                let openRecord = null;


                accessSnapshot.forEach(
                    (record) => {

                        const data =
                            record.data();


                        // Find today's record
                        // that does not yet have Time Out
                        if (
                            data.date === today &&
                            (
                                !data.timeOut ||
                                data.timeOut === ""
                            )
                        ) {

                            openRecord = {
                                id: record.id,
                                data: data
                            };

                        }

                    }
                );


                // TIME OUT
                if (openRecord !== null) {

                    const recordRef =
                        doc(
                            db,
                            "accessRecords",
                            openRecord.id
                        );


                    await updateDoc(
                        recordRef,
                        {
                            timeOut: currentTime
                        }
                    );


                    message.textContent =
                        "Time Out recorded successfully for " +
                        fullName +
                        ".";

                }


                // TIME IN
                else {

                    await addDoc(
                        collection(
                            db,
                            "accessRecords"
                        ),
                        {

                            studentId:
                                studentID,

                            fullName:
                                fullName,

                            date:
                                today,

                            timeIn:
                                currentTime,

                            timeOut:
                                ""

                        }
                    );


                    message.textContent =
                        "Time In recorded successfully for " +
                        fullName +
                        ".";

                }


                // Clear input
                document
                    .getElementById("studentID")
                    .value = "";


            } catch (error) {

                console.error(
                    "Firestore error:",
                    error
                );


                message.textContent =
                    "An error occurred while recording access. Please try again.";

            }

        };


        // System ready
        message.textContent =
            "System ready. Please enter your Student ID.";

    </script>

</body>
</html>
