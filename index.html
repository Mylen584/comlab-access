<!DOCTYPE html>
<html>
<head>

    <title>Computer Laboratory Access</title>

</head>

<body>

    <h1>Computer Laboratory Access</h1>

    <p>
        Welcome to the Computer Laboratory Access System!
    </p>

    <hr>

    <label for="studentID">
        Student ID:
    </label>

    <br>

    <input
        type="text"
        id="studentID"
        placeholder="Enter Student ID"
    >

    <br><br>

    <button
        type="button"
        onclick="recordAccess()"
    >
        Record Access
    </button>

    <p id="message">
        System ready. Please enter your Student ID.
    </p>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


        import {
            getFirestore,
            doc,
            getDoc,
            setDoc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        const firebaseConfig = {

            apiKey: "AIzaSyC8vy5n9RcdZXCgxK7HZAWGo9NzTtqOga8",

            authDomain:
                "comlab-access-system.firebaseapp.com",

            projectId:
                "comlab-access-system",

            storageBucket:
                "comlab-access-system.firebasestorage.app",

            messagingSenderId:
                "136458270853",

            appId:
                "1:136458270853:web:0ee5c5d822b109c9d151ec",

            measurementId:
                "G-6PMJ2STTDD"

        };


        const app =
            initializeApp(
                firebaseConfig
            );


        const db =
            getFirestore(app);


        const message =
            document.getElementById(
                "message"
            );


        window.recordAccess =
            async function() {

                const studentID =
                    document
                        .getElementById(
                            "studentID"
                        )
                        .value
                        .trim();


                if (
                    studentID === ""
                ) {

                    message.textContent =
                        "Please enter your Student ID.";

                    return;

                }


                message.textContent =
                    "Processing...";


                try {

                    // FIND STUDENT
                    const studentRef =
                        doc(
                            db,
                            "students",
                            studentID
                        );


                    const studentSnapshot =
                        await getDoc(
                            studentRef
                        );


                    if (
                        !studentSnapshot.exists()
                    ) {

                        message.textContent =
                            "Student ID not found. Please enter a valid Student ID.";

                        return;

                    }


                    const studentData =
                        studentSnapshot.data();


                    const fullName =
                        studentData.fullName;


                    // CURRENT DATE AND TIME
                    const now =
                        new Date();


                    const date =
                        new Intl.DateTimeFormat(
                            "en-CA",
                            {
                                timeZone:
                                    "Asia/Manila",

                                year:
                                    "numeric",

                                month:
                                    "2-digit",

                                day:
                                    "2-digit"
                            }
                        ).format(now);


                    const time =
                        new Intl.DateTimeFormat(
                            "en-US",
                            {
                                timeZone:
                                    "Asia/Manila",

                                hour:
                                    "numeric",

                                minute:
                                    "2-digit",

                                second:
                                    "2-digit",

                                hour12:
                                    true
                            }
                        ).format(now);


                    // ONE DOCUMENT PER STUDENT PER DAY
                    const recordID =
                        studentID +
                        "_" +
                        date;


                    const recordRef =
                        doc(
                            db,
                            "accessRecords",
                            recordID
                        );


                    const recordSnapshot =
                        await getDoc(
                            recordRef
                        );


                    // TIME OUT
                    if (
                        recordSnapshot.exists()
                    ) {

                        const existingData =
                            recordSnapshot.data();


                        if (
                            existingData.timeOut !== ""
                        ) {

                            message.textContent =
                                "Time Out has already been recorded for " +
                                fullName +
                                " today.";

                            return;

                        }


                        await updateDoc(

                            recordRef,

                            {

                                timeOut:
                                    time

                            }

                        );


                        message.textContent =
                            "Time Out recorded successfully for " +
                            fullName +
                            ".";

                    }


                    // TIME IN
                    else {

                        await setDoc(

                            recordRef,

                            {

                                studentId:
                                    studentID,

                                fullName:
                                    fullName,

                                date:
                                    date,

                                timeIn:
                                    time,

                                timeOut:
                                    ""

                            }

                        );


                        message.textContent =
                            "Time In recorded successfully for " +
                            fullName +
                            ".";

                    }


                    document
                        .getElementById(
                            "studentID"
                        )
                        .value = "";


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Unable to record access. Please try again.";

                }

            };

    </script>

</body>
</html>
